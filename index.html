<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote generator</title>
    <link rel="stylesheet" href="./src/input.css">
    <link rel="stylesheet" href="./dist/output.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <nav class="w-full md:hidden  bg-gray-50 font-bold h-15">
            <div class="md:hidden h-full p-2 overflow-auto flex items-center justify-between w-full " >
                <button aria-label="menubar"id="menubar" class="transition-colors cursor-pointer hover:bg-green-600 hover:text-white px-1 rounded-md text-xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <button aria-label="cutbar"id="cutbar" class="hidden transition-colors cursor-pointer hover:bg-green-600 hover:text-white px-1 rounded-md text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <p class="text-xl font-bold">Fresh<span class="text-green-600">plate</span></p>
                <button aria-label="notification" class="transition-colors cursor-pointer hover:bg-green-600 hover:text-white  px-1 text-xl rounded-md">
                    <i class="fa-regular fa-bell"></i>
                </button>
            </div>

        </nav>
        <div class="sidebar overflow-y-auto [&::-webkit-scrollbar]:w-1 overflow-x-hidden [&::-webkit-scrollbar-thumb]:bg-gray-300 font-bold transition-all duration-300 ease-in-out lg:w-1/6 md:flex md:fixed bg-neutral-300 md:left-0 -left-full md:top-0 md:w-1/4 sm:w-1/2 md:gap-3 md:p-2   md:bg-white  flex-col items-center justify-start  gap-2.5 fixed top-15  w-64 min-h-full  h-screen  backdrop-blur-2xl">
            <div class="md:flex hidden gap-2 items-center w-full p-2">
                <i class="fa-solid fa-leaf text-green-500 text-2xl"></i>
                <div class="flex flex-col items-center gap-1/7">
                    <p class="hidden md:flex text-2xl text-black ">Freshplate</p>
                    <p class="text-[9px] text-gray-600">Cook smart waste less</p>
                </div>
            </div>
            <a class="md:rounded-md w-full text-gray-800 flex gap-2 items-center justify-center transition-colors text-center p-2  md:hover:bg-gray-300  hover:bg-gray-200"href="#">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
            <a id="frigeItem"class="md:rounded-md w-full text-gray-800 flex gap-1 items-center justify-center transition-colors md:hover:bg-gray-300 text-center p-2 hover:bg-gray-200" href="#">
                <i class="fa-solid fa-box-open"></i>
                fridge items
            </a>
            <a class="additem md:rounded-md w-full text-gray-800 flex gap-1 items-center justify-center transition-colors  md:hover:bg-gray-300 text-center p-2 hover:bg-gray-200"href="#">
                <i class="fa-solid fa-circle-plus"></i>
                Add items
            </a>
            <a class="findRecipes md:rounded-md w-full text-gray-800 flex gap-1 items-center justify-center transition-colors  md:hover:bg-gray-300 text-center p-2 hover:bg-gray-200"href="#">
                <i class="fa-solid fa-utensils"></i>
                Find Recipe
            </a>
            <a class="mealPlan md:rounded-md w-full text-gray-800 flex gap-1 items-center justify-center transition-colors text-center md:hover:bg-gray-300  p-2 hover:bg-gray-200"href="#">
                <i class="fa-solid fa-plate-wheat"></i>
                Meal planner
            </a>
            <a class="md:rounded-md w-full text-gray-800 text-center flex gap-1 items-center justify-center transition-colors  md:hover:bg-gray-300  p-2 hover:bg-gray-200"href="#">
                <i class="fa-solid fa-gear"></i>
                settings
            </a>
            <div class="flex relative gap-1.5 px-10 mt-3 text-[15px]  flex-col text-gray-800">
                <p class="font-bold">Every bite counts</p>
                <p class="text-gray-700 text-[9px]">You have saved 12 items from going to waste</p>
                <img src="bowl.jpg" class="mt-1 bg-cover mr-0  w-12 max-h-12 rounded-xl"alt="">
            </div>
        </div>
    </header>
    <section class="midsection md:relative h-screen p-3 md:w-3/4 md:left-1/4 flex flex-col gap-4 items-center justify-center">
        
    </section>
    <footer>

    </footer>
</body>
<script src="script.js"></script>
</html>
